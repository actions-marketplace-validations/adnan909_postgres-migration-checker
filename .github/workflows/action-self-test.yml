name: action self-test
on:
  pull_request:
    paths: ['examples/**', 'action/**', 'action.yml', 'checker.js']
jobs:
  check-migrations:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          files: examples/**/*.sql
          fail-on: never
